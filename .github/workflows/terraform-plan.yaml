name: _ workflow call terraform plan
on:
  workflow_call:
    inputs:
      working-dir:
        type: string
        required: true
      terraform-version:
        type: string
        required: true
        default: "1.7.3"
      environment:
        type: string
        required: true
      saveplan:
        type: boolean
        required: true
    outputs:
      plan-exitcode:
        description: "The plan exit code 2 means run apply, 0 means no changes, 1 means error"
        value: ${{ jobs.plan.outputs.plan-exitcode }}
      plan-name:
        description: "The name of the plan file generated and saved when saveplan is true"
        value: ${{ jobs.plan.outputs.plan-name }}

permissions:
  id-token: write # write permission is required for az login

jobs:

  plan:
    continue-on-error: false
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-ro  # this allows targeting of a different credential when accessing environments so that plan uses different cred than apply
    env:
      # Set environment variables for terraform init backend
      ARM_TENANT_ID: ${{vars.AZURE_TENANT_ID}}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true # Allows logging into Azure using Federated ID
      ARM_USE_AZUREAD: true # setting so that Storage Blob Data Owner can be used and listkeys action is not required
      WORKING_DIR: ${{inputs.working-dir}}
      TF_VAR_environment: ${{inputs.environment}}
       # Depending on variables used in terraform add more variables here
      # eg: TF_VAR_AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: ${{inputs.working-dir}}
    permissions:
      pull-requests: write # write permission in order to add comments for terraform output
      id-token: write # write permission is required for az login
    outputs:
      plan-exitcode: ${{steps.plan.outputs.exitcode}}
      plan-name: ${{steps.plan.outputs.exitcode}}
    steps:
    - name: Azure login
      uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
       
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Load Backend Configuration
      # Allows the usage of envrionemnt variables
      run: cat backends/${{inputs.environment}}.tfbackend >> ${GITHUB_ENV}

    - name: Terraform Init
      # To run init ensure that the client id has Storage Blob Data Owner
      # TODO: Minimal permissions required to work, I don't like that the -ro client needs rw access to state storage account
      # Can a different container be used
      id: init
      run: terraform init -no-color -backend-config=backends/${{inputs.environment}}.tfbackend -backend-config="storage_account_name=${{vars.STORAGE_ACCOUNT_NAME}}" -backend-config="resource_group_name=${{vars.RESOURCE_GROUP_NAME}}"
    
    - name: Terraform Plan
      id: plan
      run: terraform plan -detailed-exitcode -no-color -out=tfplan.out
      continue-on-error: true

    - name: Save Plan
      # Store the plan so it can be used in the apply
      uses: azure/cli@089eac9d8cc39f5d003e94f8b65efc51076c9cbd # v2.1.0
      if: success() && inputs.saveplan && steps.plan.outputs.exitcode == 2
      with:
        inlineScript: |
          cd ${{ env.WORKING_DIR }}
          planname=${{ github.run_id }}.plan
          echo "planname=$planname" >> $GITHUB_OUTPUT
          az storage blob upload --overwrite --auth-mode login -f  tfplan.out --account-name ${{ vars.STORAGE_ACCOUNT_NAME }} --container-name plans --name $planname

    - name: Create Job Summary file
      run: |
        if [[ "${{steps.plan.outputs.exitcode}}" == "2" ]]; then
          cat <<'EOF' > summary.md
          ### Terraform Results  ${{ inputs.working-dir }} ${{ inputs.environment }}
          
          #### Terraform Initialization ⚙️${{ steps.init.outcome }} ${{ inputs.environment }}
          <details><summary>Initialization Output</summary>

          ```
          ${{ steps.init.outputs.stdout }}
          ```

          </details>
          
          #### Terraform Plan 📖${{ steps.plan.outcome }} ${{ inputs.environment }}
          <details><summary>Show Plan</summary>

          ```
          ${{ steps.plan.outputs.stdout }}
          ```

          </details>

        EOF
        elif [[ "${{steps.plan.outputs.exitcode}}" == "0" ]]; then
          cat <<'EOF' > summary.md
          ### Terraform Results ${{ inputs.working-dir }} ${{ inputs.environment }} No Changes
        EOF
        else
          cat <<'EOF' > summary.md
          ### Terraform Results ${{ inputs.working-dir }} ${{ inputs.environment }} ERROR

          #### Terraform Plan 📖${{ steps.plan.outcome }} ${{ inputs.environment }}
          <details><summary>ERROR</summary>

          ```
          ${{ steps.plan.outputs.stderr }}
          ```
        EOF
        fi


    - name: Update Job Summary
      run: |
        cat summary.md >> $GITHUB_STEP_SUMMARY
        

    - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      if: github.event_name == 'pull_request'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs')
          const path = require('path')
          // 1. Retrieve existing bot comments for the PR
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          })
          const botComment = comments.find(comment => {
            return comment.user.type === 'Bot' && comment.body.includes('Terraform Results ${{ inputs.working-dir }} ${{ inputs.environment }}')
          })
    
          // 2. Prepare format of the comment
          const output = fs.readFileSync(path.join(process.env.WORKING_DIR, 'summary.md')).toString()

          // 3. If we have a comment, update it, otherwise create a new one
          if (botComment) {
            github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: output
            })
          } else {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
          }

    - name: Create Check Run
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          
          const planOutput = '${{steps.plan.outputs.stdout}}';
          const exitCode = parseInt('${{ steps.plan.outputs.exit_code }}');
          
          // Parse the plan output
          const addMatch = planOutput.match(/(\d+) to add/);
          const changeMatch = planOutput.match(/(\d+) to change/);
          const destroyMatch = planOutput.match(/(\d+) to destroy/);
          const errorMatch = planOutput.match(/Error:/);
          
          const toAdd = addMatch ? parseInt(addMatch[1]) : 0;
          const toChange = changeMatch ? parseInt(changeMatch[1]) : 0;
          const toDestroy = destroyMatch ? parseInt(destroyMatch[1]) : 0;
          const hasError = errorMatch !== null || exitCode === 1;
          
          // Determine conclusion based on exit code
          // 0 = success (no changes), 1 = error, 2 = success (changes present)
          let conclusion = 'success';
          let title = '✅ Terraform Plan: No Changes';
          
          if (hasError) {
            conclusion = 'failure';
            title = '❌ Terraform Plan Failed';
          } else if (toAdd > 0 || toChange > 0 || toDestroy > 0) {
            conclusion = 'success';
            title = `📋 Terraform Plan: ${toAdd} to add, ${toChange} to change, ${toDestroy} to destroy`;
            
            // Mark as action_required if destroying resources
            if (toDestroy > 0) {
              conclusion = 'action_required';
              title = `⚠️ Terraform Plan: ${toDestroy} resource(s) will be DESTROYED`;
            }
          }
          
          // Build summary with emoji indicators
          let summary = '## Terraform Plan Summary\n\n';
          
          if (hasError) {
            summary += '### ❌ Plan Failed\n\n';
            summary += 'The Terraform plan encountered an error. Please review the details below.\n\n';
          } else {
            summary += '| Change Type | Count |\n';
            summary += '|-------------|-------|\n';
            summary += `| ➕ Add | ${toAdd} |\n`;
            summary += `| 🔄 Change | ${toChange} |\n`;
            summary += `| ➖ Destroy | ${toDestroy} |\n\n`;
            
            if (toDestroy > 0) {
              summary += '> ⚠️ **Warning:** This plan includes resource destruction. Please review carefully!\n\n';
            }
            
            if (toAdd === 0 && toChange === 0 && toDestroy === 0) {
              summary += '✨ **No infrastructure changes detected.**\n\n';
            }
          }
          
          // Extract resource changes for detailed view
          const resourceChanges = [];
          const resourcePattern = /# ([\w\.\[\]"_-]+) will be (created|updated|destroyed|replaced)/g;
          let match;
          while ((match = resourcePattern.exec(planOutput)) !== null) {
            const action = match[2];
            const emoji = {
              'created': '➕',
              'updated': '🔄', 
              'destroyed': '➖',
              'replaced': '🔃'
            }[action] || '•';
            resourceChanges.push(`${emoji} \`${match[1]}\` will be ${action}`);
          }
          
          if (resourceChanges.length > 0) {
            summary += '### Resources Affected\n\n';
            summary += resourceChanges.join('\n') + '\n\n';
          }
          
          // Truncate plan output for text field (max 65535 chars)
          let planText = '```hcl\n' + planOutput + '\n```';
          if (planText.length > 65000) {
            planText = '```hcl\n' + planOutput.substring(0, 64000) + '\n...(truncated)\n```';
          }
          
          // Build annotations for errors/warnings
          const annotations = [];
          
          // Find error lines and create annotations
          const errorLines = planOutput.split('\n');
          for (let i = 0; i < errorLines.length; i++) {
            const line = errorLines[i];
            
            // Match Terraform error format: on filename.tf line X
            const errorFileMatch = line.match(/on ([\w\-\.\/]+\.tf) line (\d+)/);
            if (errorFileMatch) {
              const errorMsgLines = [];
              for (let j = i; j < Math.min(i + 5, errorLines.length); j++) {
                if (errorLines[j].trim()) {
                  errorMsgLines.push(errorLines[j]);
                }
              }
              annotations.push({
                path: errorFileMatch[1],
                start_line: parseInt(errorFileMatch[2]),
                end_line: parseInt(errorFileMatch[2]),
                annotation_level: 'failure',
                message: errorMsgLines.join('\n'),
                title: 'Terraform Error'
              });
            }
            
            // Match deprecation warnings
            if (line.includes('Warning:') || line.includes('deprecated')) {
              const warnFileMatch = line.match(/([\w\-\.\/]+\.tf)/);
              if (warnFileMatch && annotations.length < 50) {
                annotations.push({
                  path: warnFileMatch[1],
                  start_line: 1,
                  end_line: 1,
                  annotation_level: 'warning',
                  message: line,
                  title: 'Terraform Warning'
                });
              }
            }
          }
          
          // Create the check run
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'Terraform Plan',
            head_sha: context.sha,
            status: 'completed',
            conclusion: conclusion,
            output: {
              title: title,
              summary: summary,
              text: planText,
              annotations: annotations.slice(0, 50) // GitHub limits to 50 annotations
            },
            actions: toDestroy > 0 ? [
              {
                label: 'Approve Destroy',
                description: 'Acknowledge destruction of resources',
                identifier: 'approve_destroy'
              }
            ] : []
          });
          
          // Also post as PR comment for visibility
          const prNumber = context.payload.pull_request?.number;
          if (prNumber) {
            const commentBody = `## 🏗️ Terraform Plan Results\n\n${summary}\n<details>\n<summary>Full Plan Output</summary>\n\n\`\`\`hcl\n${planOutput.substring(0, 60000)}\n\`\`\`\n</details>`;
            
            // Find existing comment to update
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            const botComment = comments.data.find(c => 
              c.user.type === 'Bot' && c.body.includes('Terraform Plan Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
          }

    - name: Terraform Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1
